spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-test-test-test-test-test-test-test
  issuer: test-suite
  access-expiration: 900000
  refresh-expiration: 1209600000
  refresh-cookie-name: vs_rt
  refresh-cookie-path: /api/auth
  cookie-secure: false
  cookie-same-site: Strict

security:
  allowed-origins:
    - http://localhost:3000
  login-rate-limit:
    max-attempts: 5
    lock-duration-seconds: 900
    window-seconds: 300
