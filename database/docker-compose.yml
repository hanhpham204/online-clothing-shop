services:
  db:
    image: mysql:8.0
    container_name: fashion_store_db
    restart: always
    # Bổ sung dòng command này để ép MySQL dùng chuẩn utf8mb4 hỗ trợ tiếng Việt
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword     # Mật khẩu tài khoản root
      MYSQL_DATABASE: fashion_store         # Tự động tạo database tên là fashion_store
      MYSQL_USER: devuser                   # (Tùy chọn) Tạo thêm user cho dev
      MYSQL_PASSWORD: devpassword           # (Tùy chọn) Mật khẩu cho user dev
    ports:
      - "3308:3306"                         # Map port 3308 của máy host với port 3306 của container
    volumes:
      # Mount file init.sql vào thư mục khởi tạo của MySQL
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # Mount volume để dữ liệu không bị mất khi xóa container
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: