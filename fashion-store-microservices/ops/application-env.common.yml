# Shared env binding reference (copy patterns into each service application.yml).
# Secrets and credentials MUST come from environment / root .env — never hardcode here.
#
# MySQL password (Docker sets MYSQL_PASSWORD; local .env uses MYSQL_ROOT_PASSWORD):
#   password: ${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD}}
#
# Eureka:
#   defaultZone: ${EUREKA_URI:http://localhost:${EUREKA_PORT:8761}/eureka/}
#
# RabbitMQ:
#   host: ${RABBITMQ_HOST:localhost}
#   port: ${RABBITMQ_PORT:5672}
#   username: ${RABBITMQ_USERNAME}
#   password: ${RABBITMQ_PASSWORD}
#
# Redis:
#   host: ${REDIS_HOST:localhost}
#   port: ${REDIS_PORT:6379}
